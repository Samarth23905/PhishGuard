plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 34
    namespace "com.phishguard"

    defaultConfig {
        applicationId "com.phishguard"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "2.0"

        // ── Change these before building ──────────────────────────────────
        // Emulator:   "http://10.0.2.2:5000"
        // Real device (same WiFi): "http://192.168.x.x:5000"
        // Override with -PphishguardServerUrl=... and -PphishguardSessionToken=...
        // Do not treat a token embedded in an APK as a durable secret.
        def localUrl = project.findProperty('phishguardServerUrl') ?: 'http://10.0.2.2:5000'
        def localToken = project.findProperty('phishguardSessionToken') ?: ''
        buildConfigField "String", "SERVER_URL", "\"${localUrl}\""
        buildConfigField "String", "SESSION_TOKEN", "\"${localToken}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def releaseUrl = project.findProperty('phishguardServerUrl') ?: 'https://your-app.onrender.com'
            def releaseToken = project.findProperty('phishguardSessionToken') ?: ''
            buildConfigField "String", "SERVER_URL", "\"${releaseUrl}\""
            buildConfigField "String", "SESSION_TOKEN", "\"${releaseToken}\""
        }
    }

    buildFeatures { buildConfig true; viewBinding true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
}
